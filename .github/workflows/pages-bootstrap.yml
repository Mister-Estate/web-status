# Déploiement initial / manuel de la page de disponibilité sur gh-pages
name: Deploy Status Page
permissions:
  contents: write
  pages: write
  id-token: write
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/pages-bootstrap.yml"
jobs:
  deploy:
    name: Build and publish gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Generate site
        uses: upptime/uptime-monitor@v1.41.0
        with:
          command: "site"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
      - name: GitHub Pages Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_PAT || github.token }}
          publish_dir: site/status-page/__sapper__/export/
          publish_branch: gh-pages
          cname: status.mister-estate.ai
          force_orphan: false
          user_name: "Upptime Bot"
          user_email: "73812536+upptime-bot@users.noreply.github.com"
